version: 2

updates:
  - package-ecosystem: npm
    directory: /frontend
    versioning-strategy: lockfile-only
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Kathmandu
    open-pull-requests-limit: 1
    groups:
      frontend-minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
        applies-to: version-updates
      frontend-security:
        applies-to: security-updates
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
    commit-message:
      prefix: deps(frontend)
    cooldown:
      default-days: 7

  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      time: "06:15"
      timezone: Asia/Kathmandu
    open-pull-requests-limit: 1
    groups:
      backend-minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
        applies-to: version-updates
      backend-security:
        applies-to: security-updates
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
      - dependency-name: ruff
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
    commit-message:
      prefix: deps(backend)
    cooldown:
      default-days: 7

  - package-ecosystem: docker
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: "06:30"
      timezone: Asia/Kathmandu
    open-pull-requests-limit: 1
    groups:
      frontend-images:
        patterns: ["*"]
        applies-to: version-updates
      frontend-image-security:
        patterns: ["*"]
        applies-to: security-updates
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
      - dependency-name: node
        versions: [">= 23"]
      - dependency-name: nginx
        versions: [">= 1.31"]
    commit-message:
      prefix: deps(frontend-image)
    cooldown:
      default-days: 7

  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      time: "06:45"
      timezone: Asia/Kathmandu
    open-pull-requests-limit: 1
    groups:
      backend-images:
        patterns: ["*"]
        applies-to: version-updates
      backend-image-security:
        patterns: ["*"]
        applies-to: security-updates
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
      - dependency-name: python
        versions: [">= 3.13"]
    commit-message:
      prefix: deps(backend-image)
    cooldown:
      default-days: 7

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Asia/Kathmandu
    open-pull-requests-limit: 1
    groups:
      actions:
        patterns: ["*"]
        applies-to: version-updates
      actions-security:
        patterns: ["*"]
        applies-to: security-updates
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
    commit-message:
      prefix: deps(actions)
    cooldown:
      default-days: 7

  - package-ecosystem: terraform
    directory: /infra/terraform
    schedule:
      interval: weekly
      day: monday
      time: "07:15"
      timezone: Asia/Kathmandu
    open-pull-requests-limit: 1
    groups:
      terraform-patch:
        patterns: ["*"]
        update-types: ["patch"]
        applies-to: version-updates
      terraform-security:
        patterns: ["*"]
        applies-to: security-updates
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
    commit-message:
      prefix: deps(terraform)
    cooldown:
      default-days: 7
