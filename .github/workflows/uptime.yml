name: Production synthetic check

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: opsforge-production-synthetic
  cancel-in-progress: true

jobs:
  health:
    name: External HTTPS health
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    env:
      HEALTH_URL: ${{ vars.OPSFORGE_HEALTH_URL || 'https://opsforge.birajadhikari49.com.np/api/health' }}
    steps:
      - name: Verify public API health
        run: |
          response_file=$(mktemp)
          trap 'rm -f "$response_file"' EXIT
          curl --fail --silent --show-error \
            --header "Accept: application/json" \
            --header "Cache-Control: no-cache" \
            --user-agent "OpsForge-GitHub-Synthetic/1.0" \
            --connect-timeout 10 --max-time 20 \
            --retry 5 --retry-all-errors --retry-delay 10 \
            --output "$response_file" \
            "$HEALTH_URL"
          python3 - "$response_file" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as response:
              payload = json.load(response)

          if payload.get("success") is not True or payload.get("data", {}).get("status") != "healthy":
              raise SystemExit(f"Unexpected health response: {payload!r}")
          PY
