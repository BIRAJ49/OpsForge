name: OpsForge CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "30 0 * * 1"
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      terraform_apply:
        description: Apply the reviewed Terraform configuration
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: opsforge-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/biraj49/opsforge-backend
  FRONTEND_IMAGE: ghcr.io/biraj49/opsforge-frontend
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_VAR_aws_region: ${{ vars.AWS_REGION }}
  TF_VAR_domain_name: ${{ vars.OPSFORGE_DOMAIN }}
  TF_VAR_grafana_domain_name: ${{ vars.GRAFANA_DOMAIN }}
  TF_VAR_argocd_domain_name: ${{ vars.ARGOCD_DOMAIN }}
  TF_VAR_cloudflare_zone_id: ${{ vars.CLOUDFLARE_ZONE_ID }}
  TF_VAR_cloudflare_account_id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
  TF_VAR_cloudflare_access_email: ${{ vars.CLOUDFLARE_ACCESS_EMAIL }}
  TF_VAR_cloudflare_github_idp_id: ${{ vars.CLOUDFLARE_GITHUB_IDP_ID }}
  TF_VAR_enable_admin_access: ${{ vars.ENABLE_ADMIN_ACCESS || 'false' }}
  TF_VAR_ssh_allowed_cidr: ${{ vars.SSH_ALLOWED_CIDR }}
  TF_VAR_ssh_public_key: ${{ vars.SSH_PUBLIC_KEY }}
  TF_VAR_budget_alert_email: ${{ vars.BUDGET_ALERT_EMAIL }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

jobs:
  test:
    name: Test and build
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Run backend tests
        working-directory: backend
        run: pip install -r requirements.txt && pytest -q
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend
        working-directory: frontend
        run: npm ci && npm run build

  codeql:
    name: CodeQL (${{ matrix.language }})
    if: github.event_name != 'schedule' || github.event.schedule == '30 0 * * 1'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: github/codeql-action/init@24c7eb380a2dc368f2d129e4c65e51d172983a1e # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@24c7eb380a2dc368f2d129e4c65e51d172983a1e # v4
        with:
          category: /language:${{ matrix.language }}

  infrastructure-scan:
    name: IaC and manifest security
    if: github.event_name != 'schedule' || github.event.schedule == '30 0 * * 1'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Generate SARIF report
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: misconfig
          trivyignores: .trivyignore.yaml
          severity: HIGH,CRITICAL
          format: sarif
          output: trivy-iac.sarif
          exit-code: 0
      - uses: github/codeql-action/upload-sarif@24c7eb380a2dc368f2d129e4c65e51d172983a1e # v4
        with:
          sarif_file: trivy-iac.sarif
          category: trivy-iac
      - name: Enforce policy
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: misconfig
          trivyignores: .trivyignore.yaml
          severity: HIGH,CRITICAL
          format: table
          exit-code: 1
          skip-setup-trivy: true

  images:
    name: Build, scan, sign, and publish images
    if: github.event_name != 'schedule'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      security-events: write
    outputs:
      backend_digest: ${{ steps.publish.outputs.backend_digest }}
      frontend_digest: ${{ steps.publish.outputs.frontend_digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - name: Build images locally
        run: |
          docker buildx build --load --platform linux/amd64 \
            --tag "$BACKEND_IMAGE:$GITHUB_SHA" ./backend
          docker buildx build --load --platform linux/amd64 \
            --tag "$FRONTEND_IMAGE:$GITHUB_SHA" ./frontend
      - name: Scan backend image
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: 1
          scanners: vuln
      - name: Scan frontend image
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: 1
          scanners: vuln
          skip-setup-trivy: true
      - name: Generate SBOMs
        run: |
          trivy image --format cyclonedx --output backend-sbom.cdx.json "$BACKEND_IMAGE:$GITHUB_SHA"
          trivy image --format cyclonedx --output frontend-sbom.cdx.json "$FRONTEND_IMAGE:$GITHUB_SHA"
      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish immutable images
        if: github.event_name != 'pull_request'
        id: publish
        run: |
          docker push "$BACKEND_IMAGE:$GITHUB_SHA"
          docker push "$FRONTEND_IMAGE:$GITHUB_SHA"
          backend_ref=$(docker image inspect --format='{{index .RepoDigests 0}}' "$BACKEND_IMAGE:$GITHUB_SHA")
          frontend_ref=$(docker image inspect --format='{{index .RepoDigests 0}}' "$FRONTEND_IMAGE:$GITHUB_SHA")
          echo "backend_digest=${backend_ref#*@}" >> "$GITHUB_OUTPUT"
          echo "frontend_digest=${frontend_ref#*@}" >> "$GITHUB_OUTPUT"
      - name: Attest backend provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ env.BACKEND_IMAGE }}
          subject-digest: ${{ steps.publish.outputs.backend_digest }}
          push-to-registry: true
      - name: Attest backend SBOM
        if: github.event_name != 'pull_request'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ env.BACKEND_IMAGE }}
          subject-digest: ${{ steps.publish.outputs.backend_digest }}
          sbom-path: backend-sbom.cdx.json
          push-to-registry: true
      - name: Attest frontend provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ env.FRONTEND_IMAGE }}
          subject-digest: ${{ steps.publish.outputs.frontend_digest }}
          push-to-registry: true
      - name: Attest frontend SBOM
        if: github.event_name != 'pull_request'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ env.FRONTEND_IMAGE }}
          subject-digest: ${{ steps.publish.outputs.frontend_digest }}
          sbom-path: frontend-sbom.cdx.json
          push-to-registry: true

  promote:
    name: Open GitOps promotion PR
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && vars.ENABLE_GITOPS_PROMOTION == 'true'
    needs: [images, codeql, infrastructure-scan]
    runs-on: ubuntu-latest
    steps:
      - name: Create repository-scoped GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ secrets.GITOPS_APP_CLIENT_ID }}
          private-key: ${{ secrets.GITOPS_APP_PRIVATE_KEY }}
          owner: BIRAJ49
          repositories: OpsForge-GitOps
      - name: Checkout GitOps repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: BIRAJ49/OpsForge-GitOps
          token: ${{ steps.app-token.outputs.token }}
          path: gitops
      - name: Update production digests
        working-directory: gitops
        env:
          BACKEND_DIGEST: ${{ needs.images.outputs.backend_digest }}
          FRONTEND_DIGEST: ${{ needs.images.outputs.frontend_digest }}
        run: |
          python3 -m pip install --disable-pip-version-check PyYAML==6.0.3
          python3 scripts/update-images.py \
            --backend "$BACKEND_IMAGE@$BACKEND_DIGEST" \
            --frontend "$FRONTEND_IMAGE@$FRONTEND_DIGEST"
          kubectl kustomize production >/tmp/opsforge-applications.yaml
          kubectl kustomize production/opsforge >/tmp/opsforge-workloads.yaml
          grep -F "$BACKEND_IMAGE@$BACKEND_DIGEST" /tmp/opsforge-workloads.yaml
          grep -F "$FRONTEND_IMAGE@$FRONTEND_DIGEST" /tmp/opsforge-workloads.yaml
      - name: Open or update promotion pull request
        working-directory: gitops
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          branch="promote/${GITHUB_SHA}"
          git config user.name "opsforge-gitops[bot]"
          git config user.email "opsforge-gitops[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add production
          git commit -m "promote: OpsForge ${GITHUB_SHA}"
          git push --force-with-lease origin "$branch"
          gh pr create --repo BIRAJ49/OpsForge-GitOps --base main --head "$branch" \
            --title "promote: OpsForge ${GITHUB_SHA}" \
            --body "Promotes signed backend and frontend image digests built from BIRAJ49/OpsForge@${GITHUB_SHA}." \
            || true
          gh pr merge --repo BIRAJ49/OpsForge-GitOps "$branch" --auto --squash

  terraform-plan:
    name: Terraform plan
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Configure read-only AWS credentials
        uses: aws-actions/configure-aws-credentials@cabfdba3510de1431bac9dba27511d97497fc100 # v5
        with:
          role-to-assume: ${{ vars.AWS_TERRAFORM_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
      - name: Validate and plan
        run: |
          terraform -chdir=infra/terraform fmt -check -diff
          terraform -chdir=infra/terraform init -input=false
          terraform -chdir=infra/terraform validate
          terraform -chdir=infra/terraform plan -no-color -out=tfplan
      - name: Publish plan summary
        if: always()
        run: |
          {
            echo '## Terraform production plan'
            echo '```terraform'
            terraform -chdir=infra/terraform show -no-color tfplan 2>&1 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  terraform-apply:
    name: Terraform apply
    if: github.event_name == 'workflow_dispatch' && inputs.terraform_apply
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Configure production AWS credentials
        uses: aws-actions/configure-aws-credentials@cabfdba3510de1431bac9dba27511d97497fc100 # v5
        with:
          role-to-assume: ${{ vars.AWS_TERRAFORM_APPLY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
      - name: Apply reviewed production configuration
        run: |
          terraform -chdir=infra/terraform fmt -check -diff
          terraform -chdir=infra/terraform init -input=false
          terraform -chdir=infra/terraform validate
          terraform -chdir=infra/terraform apply -auto-approve

  uptime:
    name: External production uptime
    if: github.event_name == 'schedule' && github.event.schedule == '*/10 * * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Verify public HTTPS health
        run: |
          curl --fail --silent --show-error \
            --retry 3 --retry-all-errors --retry-delay 15 --max-time 20 \
            https://opsforge.birajadhikari49.com.np/api/health
