name: OpsForge GitOps delivery

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: opsforge-gitops-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/biraj49/opsforge-backend
  FRONTEND_IMAGE: ghcr.io/biraj49/opsforge-frontend

jobs:
  publish:
    name: Build and publish images
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      backend_digest: ${{ steps.publish.outputs.backend_digest }}
      frontend_digest: ${{ steps.publish.outputs.frontend_digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish immutable images
        id: publish
        env:
          BACKEND_METADATA: ${{ runner.temp }}/backend-image-metadata.json
          FRONTEND_METADATA: ${{ runner.temp }}/frontend-image-metadata.json
        run: |
          set -euo pipefail

          docker buildx build \
            --pull \
            --platform linux/amd64 \
            --provenance=false \
            --sbom=false \
            --tag "$BACKEND_IMAGE:$GITHUB_SHA" \
            --metadata-file "$BACKEND_METADATA" \
            --push \
            ./backend

          docker buildx build \
            --pull \
            --platform linux/amd64 \
            --provenance=false \
            --sbom=false \
            --tag "$FRONTEND_IMAGE:$GITHUB_SHA" \
            --metadata-file "$FRONTEND_METADATA" \
            --push \
            ./frontend

          backend_digest=$(
            python3 - "$BACKEND_METADATA" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as metadata:
              print(json.load(metadata)["containerimage.digest"])
          PY
          )
          frontend_digest=$(
            python3 - "$FRONTEND_METADATA" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as metadata:
              print(json.load(metadata)["containerimage.digest"])
          PY
          )

          [[ "$backend_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$frontend_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "backend_digest=$backend_digest" >> "$GITHUB_OUTPUT"
          echo "frontend_digest=$frontend_digest" >> "$GITHUB_OUTPUT"

  promote:
    name: Open GitOps deployment PR
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      GITOPS_OWNER: ${{ vars.GITOPS_OWNER || github.repository_owner }}
      GITOPS_REPOSITORY: ${{ vars.GITOPS_REPOSITORY || 'OpsForge-GitOps' }}
    steps:
      - name: Create GitOps repository token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ secrets.GITOPS_APP_CLIENT_ID }}
          private-key: ${{ secrets.GITOPS_APP_PRIVATE_KEY }}
          owner: ${{ env.GITOPS_OWNER }}
          repositories: ${{ env.GITOPS_REPOSITORY }}
          permission-contents: write
          permission-pull-requests: write
      - name: Checkout deployment helper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          path: source
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Checkout GitOps repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ env.GITOPS_OWNER }}/${{ env.GITOPS_REPOSITORY }}
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false
          fetch-depth: 0
          ref: main
          path: gitops
      - name: Prepare the deployment branch
        id: branch
        working-directory: gitops
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail

          branch="deploy/opsforge-production"
          git config user.name "$GITHUB_ACTOR"
          git config user.email "${GITHUB_ACTOR_ID}+${GITHUB_ACTOR}@users.noreply.github.com"
          gh auth setup-git

          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            git fetch --no-tags origin "refs/heads/$branch:refs/remotes/origin/$branch"
            git switch --track -c "$branch" "refs/remotes/origin/$branch"
            git merge --no-edit "refs/remotes/origin/main"
          else
            git switch -c "$branch"
          fi
          echo "name=$branch" >> "$GITHUB_OUTPUT"
      - name: Update production image digests
        working-directory: gitops
        env:
          BACKEND_DIGEST: ${{ needs.publish.outputs.backend_digest }}
          FRONTEND_DIGEST: ${{ needs.publish.outputs.frontend_digest }}
        run: |
          set -euo pipefail

          python -m pip install \
            --disable-pip-version-check \
            --no-cache-dir \
            --no-deps \
            --only-binary=:all: \
            --require-hashes \
            -r ../source/backend/requirements-gitops.txt
          python ../source/scripts/update-images.py \
            --backend "$BACKEND_IMAGE@$BACKEND_DIGEST" \
            --frontend "$FRONTEND_IMAGE@$FRONTEND_DIGEST"

          kubectl kustomize production >/tmp/opsforge-applications.yaml
          kubectl kustomize production/opsforge >/tmp/opsforge-workloads.yaml
          grep -Fq "image: $BACKEND_IMAGE@$BACKEND_DIGEST" /tmp/opsforge-workloads.yaml
          grep -Fq "image: $FRONTEND_IMAGE@$FRONTEND_DIGEST" /tmp/opsforge-workloads.yaml
          git diff --check
      - name: Open deployment pull request
        working-directory: gitops
        env:
          BRANCH: ${{ steps.branch.outputs.name }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail

          repository="$GITOPS_OWNER/$GITOPS_REPOSITORY"
          body="Deploys backend and frontend image digests built from ${GITHUB_REPOSITORY}@${GITHUB_SHA}."
          git add production/opsforge/kustomization.yaml

          if ! git diff --cached --quiet; then
            git commit -m "deploy: OpsForge ${GITHUB_SHA}"
          fi

          if git diff --quiet "refs/remotes/origin/main" HEAD; then
            echo "These image digests are already deployed."
            exit 0
          fi
          git push --set-upstream origin "HEAD:$BRANCH"

          existing_pr=$(gh pr list \
            --repo "$repository" \
            --state open \
            --base main \
            --head "$BRANCH" \
            --json number \
            --jq '.[0].number // empty')
          if [[ -n "$existing_pr" ]]; then
            gh pr edit "$existing_pr" \
              --repo "$repository" \
              --title "deploy: OpsForge production" \
              --body "$body"
            echo "Updated deployment PR #$existing_pr."
            exit 0
          fi

          gh pr create \
            --repo "$repository" \
            --base main \
            --head "$BRANCH" \
            --title "deploy: OpsForge production" \
            --body "$body"
