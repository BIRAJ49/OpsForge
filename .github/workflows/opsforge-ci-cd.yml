name: OpsForge production CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: opsforge-application-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/biraj49/opsforge-backend
  FRONTEND_IMAGE: ghcr.io/biraj49/opsforge-frontend

jobs:
  backend:
    name: Backend quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      APP_ENV: test
      DATABASE_URL: postgresql://opsforge:opsforge-ci-password@localhost:5432/opsforge_test
      JWT_SECRET_KEY: opsforge-ci-secret-at-least-32-bytes
      ADMIN_PASSWORD: admin-password-123
    services:
      postgres:
        image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
        env:
          POSTGRES_DB: opsforge_test
          POSTGRES_USER: opsforge
          POSTGRES_PASSWORD: opsforge-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U opsforge -d opsforge_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install dependencies
        working-directory: backend
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Verify dependency compatibility
        working-directory: backend
        run: python -m pip check
      - name: Lint backend
        working-directory: backend
        run: python -m ruff check app alembic
      - name: Verify PostgreSQL migrations
        working-directory: backend
        run: |
          python -m alembic upgrade head
          python -m alembic check
      - name: Run tests
        working-directory: backend
        run: python -m pytest -q

  frontend:
    name: Frontend quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        working-directory: frontend
        run: npm ci
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Build
        working-directory: frontend
        run: npm run build

  configuration:
    name: Configuration quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Lint GitHub Actions
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/repo" \
            --workdir /repo \
            docker.io/rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 \
            -color .github/workflows/*.yml deploy/gitops-workflow-template.yml
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false
      - name: Validate Terraform without production credentials
        env:
          TF_IN_AUTOMATION: "true"
          TF_INPUT: "false"
        run: |
          terraform -chdir=infra/terraform fmt -check -diff
          terraform -chdir=infra/terraform init -backend=false -input=false -lockfile=readonly
          terraform -chdir=infra/terraform validate
      - name: Render Kubernetes manifests
        run: |
          kubectl kustomize deploy/k8s >/tmp/opsforge-applications.yaml
          kubectl kustomize deploy/k8s/opsforge >/tmp/opsforge-workloads.yaml
          grep -Fq "name: opsforge-backend" /tmp/opsforge-workloads.yaml
          grep -Fq "name: opsforge-frontend" /tmp/opsforge-workloads.yaml
          grep -Fq "path: deploy/k8s/platform-access" deploy/k8s/applications/platform-access.yaml
      - name: Validate Compose configuration
        run: |
          cp backend/.env.example backend/.env
          docker compose config --quiet

  build_images:
    name: Build immutable images
    needs: [backend, frontend, configuration]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      artifact_id: ${{ steps.artifact.outputs.artifact-id }}
      artifact_digest: ${{ steps.artifact.outputs.artifact-digest }}
      backend_sha256: ${{ steps.hashes.outputs.backend_sha256 }}
      frontend_sha256: ${{ steps.hashes.outputs.frontend_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - name: Build each image exactly once
        run: |
          mkdir -p release-images
          backend_cache=()
          frontend_cache=()
          if [[ "$GITHUB_EVENT_NAME" != "pull_request" ]]; then
            backend_cache=(--cache-to "type=gha,mode=max,scope=backend")
            frontend_cache=(--cache-to "type=gha,mode=max,scope=frontend")
          fi
          docker buildx build --pull --platform linux/amd64 --provenance=false \
            --cache-from type=gha,scope=backend \
            "${backend_cache[@]}" \
            --tag "$BACKEND_IMAGE:$GITHUB_SHA" \
            --output type=docker,dest=release-images/backend-image.tar \
            ./backend
          docker buildx build --pull --platform linux/amd64 --provenance=false \
            --cache-from type=gha,scope=frontend \
            "${frontend_cache[@]}" \
            --tag "$FRONTEND_IMAGE:$GITHUB_SHA" \
            --output type=docker,dest=release-images/frontend-image.tar \
            ./frontend
      - name: Record image archive hashes
        id: hashes
        run: |
          cd release-images
          sha256sum backend-image.tar frontend-image.tar > SHA256SUMS
          echo "backend_sha256=$(sha256sum backend-image.tar | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
          echo "frontend_sha256=$(sha256sum frontend-image.tar | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
          sha256sum --check SHA256SUMS
      - name: Upload immutable image archives
        id: artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-images-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-images/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
          overwrite: false

  security_gate:
    name: Security gate
    if: always()
    needs: [backend, frontend, configuration, build_images]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write # Upload CodeQL and Trivy SARIF from this unprivileged gate.
    outputs:
      evidence_artifact_id: ${{ steps.evidence.outputs.artifact-id }}
      evidence_artifact_digest: ${{ steps.evidence.outputs.artifact-digest }}
    steps:
      - name: Require successful quality and build jobs
        env:
          BACKEND_RESULT: ${{ needs.backend.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          CONFIGURATION_RESULT: ${{ needs.configuration.result }}
          BUILD_RESULT: ${{ needs.build_images.result }}
        run: |
          for result in "$BACKEND_RESULT" "$FRONTEND_RESULT" "$CONFIGURATION_RESULT" "$BUILD_RESULT"; do
            if [[ "$result" != "success" ]]; then
              echo "A required prerequisite did not succeed." >&2
              exit 1
            fi
          done
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up the pinned Go toolchain for security tools
        id: trivy_go
        continue-on-error: true
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.5"
          cache: false
      - name: Initialize CodeQL for both application languages
        id: codeql_init
        continue-on-error: true
        uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3 # v4
        with:
          languages: python,javascript-typescript
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
      - name: Build and self-scan the pinned Trivy scanner
        id: trivy_toolchain
        continue-on-error: true
        env:
          GONOSUMDB: ""
          GONOPROXY: ""
          GOPRIVATE: ""
          GOPROXY: https://proxy.golang.org
          GOSUMDB: sum.golang.org
          GOTOOLCHAIN: local
          TRIVY_BINARY_SHA256: bdd4d5427975109a357f06c1f21f49b4b9607ea63c5aa4368e81407372346fb2
          TRIVY_GO_VERSION: 1.26.5
          TRIVY_SOURCE_COMMIT: 40c73e5d6166dcc0346a1ab4e94499d1572854e4
          TRIVY_SOURCE_TREE: 35d71c560d5475f7da2c2ba31eb6dadeb2ded933
          TRIVY_PATCH_COMMIT: 18c531d6222968e02031f75fceda487654874532
          TRIVY_PATCH_DIFF_SHA256: fbabb150925746131eb8a13261642aced82ecb91b14c8e9074d3bbdbfb03cd0f
          TRIVY_PATCH_VERSION: v0.73.0-opsforge.1
          TRIVY_VERSION: 0.73.0
          TRIVY_GO_GIT_VERSION: v5.19.2
          TRIVY_ORAS_VERSION: v2.6.2
        run: |
          set -euo pipefail

          [[ "$(go env GOVERSION)" == "go${TRIVY_GO_VERSION}" ]]
          source_dir=$(mktemp -d "$RUNNER_TEMP/trivy-source.XXXXXX")
          install_dir="$RUNNER_TEMP/opsforge-trivy-bin"
          self_scan_root=$(mktemp -d "$RUNNER_TEMP/trivy-self-scan.XXXXXX")
          trivy_binary="$install_dir/trivy"

          git init --quiet "$source_dir"
          git -C "$source_dir" remote add origin https://github.com/aquasecurity/trivy.git
          git -C "$source_dir" fetch --quiet --depth=1 --no-tags origin "$TRIVY_SOURCE_COMMIT"
          git -C "$source_dir" checkout --quiet --detach FETCH_HEAD
          [[ "$(git -C "$source_dir" rev-parse HEAD)" == "$TRIVY_SOURCE_COMMIT" ]]
          [[ "$(git -C "$source_dir" rev-parse 'HEAD^{tree}')" == "$TRIVY_SOURCE_TREE" ]]
          [[ "$(python -c 'import json, sys; print(json.load(open(sys.argv[1]))["."])' "$source_dir/.release-please-manifest.json")" == "$TRIVY_VERSION" ]]

          cd "$source_dir"
          go get \
            "github.com/go-git/go-git/v5@${TRIVY_GO_GIT_VERSION}" \
            "oras.land/oras-go/v2@${TRIVY_ORAS_VERSION}"
          go mod verify
          [[ "$(go list -m -f '{{.Version}}' github.com/go-git/go-git/v5)" == "$TRIVY_GO_GIT_VERSION" ]]
          [[ "$(go list -m -f '{{.Version}}' oras.land/oras-go/v2)" == "$TRIVY_ORAS_VERSION" ]]
          git diff --binary "$TRIVY_SOURCE_COMMIT" -- go.mod go.sum > "$GITHUB_WORKSPACE/trivy-toolchain.patch"
          [[ "$(sha256sum "$GITHUB_WORKSPACE/trivy-toolchain.patch" | cut -d ' ' -f 1)" == "$TRIVY_PATCH_DIFF_SHA256" ]]

          git add go.mod go.sum
          GIT_AUTHOR_DATE=2026-08-08T00:00:00Z \
          GIT_COMMITTER_DATE=2026-08-08T00:00:00Z \
            git -c user.name="OpsForge Release Bot" \
              -c user.email="release@opsforge.local" \
              -c commit.gpgsign=false \
              commit --quiet -m "build(deps): patch Trivy 0.73.0 vulnerability fixes"
          [[ "$(git rev-parse HEAD)" == "$TRIVY_PATCH_COMMIT" ]]
          git -c tag.gpgSign=false tag "$TRIVY_PATCH_VERSION"
          [[ "$(git describe --tags --exact-match HEAD)" == "$TRIVY_PATCH_VERSION" ]]
          [[ -z "$(git status --porcelain)" ]]

          mkdir -p "$install_dir"
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 GOEXPERIMENT=jsonv2 go build \
            -mod=readonly \
            -trimpath \
            -ldflags="-s -w -extldflags '-static' -X github.com/aquasecurity/trivy/pkg/version/app.ver=${TRIVY_PATCH_VERSION#v}" \
            -o "$trivy_binary" \
            ./cmd/trivy/
          chmod 0755 "$trivy_binary"
          [[ "$(sha256sum "$trivy_binary" | cut -d ' ' -f 1)" == "$TRIVY_BINARY_SHA256" ]]

          go version "$trivy_binary" | grep -F "go${TRIVY_GO_VERSION}"
          go version -m "$trivy_binary" | tee "$GITHUB_WORKSPACE/trivy-toolchain-build-info.txt"
          awk -F '\t' -v expected="$TRIVY_PATCH_VERSION" \
            '$2 == "mod" && $3 == "github.com/aquasecurity/trivy" && $4 == expected { found = 1 } END { exit !found }' \
            "$GITHUB_WORKSPACE/trivy-toolchain-build-info.txt"
          awk -F '\t' -v expected="$TRIVY_GO_GIT_VERSION" \
            '$2 == "dep" && $3 == "github.com/go-git/go-git/v5" && $4 == expected { found = 1 } END { exit !found }' \
            "$GITHUB_WORKSPACE/trivy-toolchain-build-info.txt"
          awk -F '\t' -v expected="$TRIVY_ORAS_VERSION" \
            '$2 == "dep" && $3 == "oras.land/oras-go/v2" && $4 == expected { found = 1 } END { exit !found }' \
            "$GITHUB_WORKSPACE/trivy-toolchain-build-info.txt"
          "$trivy_binary" version | tee "$GITHUB_WORKSPACE/trivy-toolchain-version.txt"
          grep -Fq "Version: ${TRIVY_PATCH_VERSION#v}" "$GITHUB_WORKSPACE/trivy-toolchain-version.txt"

          install -m 0755 "$trivy_binary" "$self_scan_root/trivy"
          "$trivy_binary" rootfs \
            --cache-dir "$GITHUB_WORKSPACE/.cache/trivy" \
            --scanners vuln \
            --list-all-pkgs \
            --severity HIGH,CRITICAL \
            --format json \
            --output "$GITHUB_WORKSPACE/trivy-toolchain-vulnerabilities.json" \
            "$self_scan_root"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          report_path = Path(os.environ["GITHUB_WORKSPACE"]) / "trivy-toolchain-vulnerabilities.json"
          report = json.loads(report_path.read_text())
          packages = {
              (package.get("Name"), package.get("Version"))
              for result in report.get("Results", [])
              for package in result.get("Packages") or []
          }
          expected = {
              ("github.com/aquasecurity/trivy", "v0.73.0-opsforge.1"),
              ("github.com/go-git/go-git/v5", "v5.19.2"),
              ("oras.land/oras-go/v2", "v2.6.2"),
          }
          missing = expected - packages
          if missing:
              raise SystemExit(f"Trivy self-scan did not inventory expected modules: {sorted(missing)}")

          blocked = [
              vulnerability
              for result in report.get("Results", [])
              for vulnerability in result.get("Vulnerabilities") or []
              if vulnerability.get("Severity") in {"HIGH", "CRITICAL"}
          ]
          if blocked:
              for vulnerability in blocked:
                  print(
                      "BLOCKED Trivy toolchain: "
                      f"{vulnerability.get('VulnerabilityID', 'unknown')} "
                      f"{vulnerability.get('PkgName', 'unknown')} "
                      f"{vulnerability.get('Severity', 'unknown')}"
                  )
              raise SystemExit(f"Blocked {len(blocked)} high/critical Trivy toolchain finding(s)")
          print("The pinned Trivy toolchain contains no high or critical vulnerabilities.")
          PY
          {
            echo "source_commit=$TRIVY_SOURCE_COMMIT"
            echo "source_tree=$TRIVY_SOURCE_TREE"
            echo "patch_commit=$TRIVY_PATCH_COMMIT"
            echo "patch_sha256=$TRIVY_PATCH_DIFF_SHA256"
            echo "version=$TRIVY_PATCH_VERSION"
            echo "go_version=$TRIVY_GO_VERSION"
            echo "binary_sha256=$TRIVY_BINARY_SHA256"
          } >> "$GITHUB_OUTPUT"
          echo "$install_dir" >> "$GITHUB_PATH"
      - name: Install the Python dependency scanner
        run: |
          python -m pip install \
            --disable-pip-version-check \
            --no-cache-dir \
            --only-binary=:all: \
            --require-hashes \
            -r backend/requirements-audit.txt
          python -m pip check
          [[ "$(python -m pip --version)" == pip\ 26.2.1\ * ]]
          [[ "$(python -m pip_audit --version)" == "pip-audit 2.10.1" ]]
      - name: Audit the hash-locked dependency-scanner environment
        id: dependency_scanner_dependencies
        continue-on-error: true
        run: python -m pip_audit --strict --no-deps -r backend/requirements-audit.txt
      - name: Audit the hash-locked GitOps promotion tool
        id: gitops_tool_dependencies
        continue-on-error: true
        run: python -m pip_audit --strict --no-deps -r backend/requirements-gitops.txt
      - name: Audit backend production dependencies
        id: backend_dependencies
        continue-on-error: true
        run: python -m pip_audit --strict -r backend/requirements.txt
      - name: Audit frontend production dependencies
        id: frontend_dependencies
        continue-on-error: true
        working-directory: frontend
        run: |
          set -euo pipefail
          audit_report=$(mktemp "$RUNNER_TEMP/frontend-audit.XXXXXX.json")
          trap 'rm -f "$audit_report"' EXIT
          set +e
          npm audit --omit=dev --audit-level=high --json > "$audit_report"
          audit_status=$?
          set -e
          python - "$audit_report" "$audit_status" <<'PY'
          import json
          import sys
          from datetime import date
          from pathlib import Path

          report = json.loads(Path(sys.argv[1]).read_text())
          audit_status = int(sys.argv[2])
          vulnerabilities = report.get("vulnerabilities") or {}
          waivers = {
              "GHSA-qwww-vcr4-c8h2": {
                  "expires": "2026-10-31",
                  "reason": (
                      "OpsForge is a client-only SPA and does not use React Router "
                      "RSC actions; no patched v7 release is available."
                  ),
              }
          }

          def advisories_for(package_name, visited=None):
              visited = set() if visited is None else visited
              if package_name in visited:
                  return []
              visited.add(package_name)
              advisories = []
              for item in (vulnerabilities.get(package_name) or {}).get("via") or []:
                  if isinstance(item, str):
                      advisories.extend(advisories_for(item, visited))
                  elif isinstance(item, dict):
                      advisories.append(item)
              return advisories

          unique = {}
          for package_name in vulnerabilities:
              for advisory in advisories_for(package_name):
                  identifier = str(advisory.get("url") or advisory.get("source", "unknown")).rstrip("/").split("/")[-1]
                  unique[identifier] = advisory

          today = date.today().isoformat()
          blocked = []
          for identifier, advisory in unique.items():
              if str(advisory.get("severity", "")).lower() not in {"high", "critical"}:
                  continue
              waiver = waivers.get(identifier)
              if waiver and today <= waiver["expires"]:
                  print(
                      f"WAIVED {identifier} until {waiver['expires']}: "
                      f"{waiver['reason']}"
                  )
                  continue
              blocked.append((identifier, advisory, waiver))

          if blocked:
              for identifier, advisory, waiver in blocked:
                  prefix = "EXPIRED" if waiver else "BLOCKED"
                  print(
                      f"{prefix} {identifier}: {advisory.get('title', 'unknown')} "
                      f"({advisory.get('severity', 'unknown')})",
                      file=sys.stderr,
                  )
              raise SystemExit(1)
          if audit_status != 0 and not unique:
              raise SystemExit("npm audit failed without structured advisories")
          print("No unwaived high or critical production dependency vulnerabilities found.")
          PY
      - name: Audit GitHub Actions policy
        id: workflow_security
        continue-on-error: true
        uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054 # v0.6.2
        with:
          inputs: .github/workflows deploy/gitops-workflow-template.yml
          persona: pedantic
          version: 1.29.0
          advanced-security: false
          annotations: true
      - name: Analyze source with CodeQL
        id: codeql_analyze
        continue-on-error: true
        uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3 # v4
        with:
          category: /security-gate
          output: codeql-results
          upload: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'never' || 'always' }}
      - name: Enforce high and critical CodeQL findings
        id: codeql_policy
        continue-on-error: true
        env:
          CODEQL_SARIF_DIRECTORY: ${{ steps.codeql_analyze.outputs.sarif-output }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["CODEQL_SARIF_DIRECTORY"])
          files = sorted(root.rglob("*.sarif"))
          if not files:
              raise SystemExit("CodeQL produced no SARIF files")

          blocked = []
          for path in files:
              document = json.loads(path.read_text())
              for run in document.get("runs", []):
                  tool = run.get("tool", {})
                  driver_rules = tool.get("driver", {}).get("rules", [])
                  rules_by_id = {rule.get("id"): rule for rule in driver_rules}
                  for extension in tool.get("extensions", []):
                      rules_by_id.update(
                          {rule.get("id"): rule for rule in extension.get("rules", [])}
                      )
                  for result in run.get("results", []):
                      rule = rules_by_id.get(result.get("ruleId"), {})
                      index = result.get("ruleIndex")
                      if not rule and isinstance(index, int) and index < len(driver_rules):
                          rule = driver_rules[index]
                      properties = rule.get("properties", {})
                      raw_score = properties.get("security-severity")
                      try:
                          score = float(raw_score)
                      except (TypeError, ValueError):
                          score = 0.0
                      level = result.get("level") or rule.get("defaultConfiguration", {}).get("level", "")
                      if score >= 7.0 or level == "error":
                          message = result.get("message", {}).get("text", "CodeQL finding")
                          blocked.append((result.get("ruleId", "unknown"), score, level, message))

          if blocked:
              for rule_id, score, level, message in blocked:
                  print(f"BLOCKED {rule_id}: score={score:g} level={level} - {message}")
              raise SystemExit(f"Blocked {len(blocked)} high/critical CodeQL finding(s)")
          print("No high or critical CodeQL findings detected.")
          PY
      - name: Re-verify the approved scanner before repository and image scans
        id: trivy_integrity
        continue-on-error: true
        env:
          EXPECTED_TRIVY_BINARY_SHA256: ${{ steps.trivy_toolchain.outputs.binary_sha256 }}
          EXPECTED_TRIVY_VERSION: ${{ steps.trivy_toolchain.outputs.version }}
        run: |
          set -euo pipefail
          scanner="$RUNNER_TEMP/opsforge-trivy-bin/trivy"
          [[ "$EXPECTED_TRIVY_BINARY_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$EXPECTED_TRIVY_VERSION" == "v0.73.0-opsforge.1" ]]
          [[ -x "$scanner" ]]
          [[ "$(command -v trivy)" == "$scanner" ]]
          [[ "$(sha256sum "$scanner" | cut -d ' ' -f 1)" == "$EXPECTED_TRIVY_BINARY_SHA256" ]]
          "$scanner" version | grep -F "Version: ${EXPECTED_TRIVY_VERSION#v}"
      - name: Generate IaC and secret SARIF
        id: repository_policy_report
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: misconfig,secret
          skip-dirs: infra/terraform/.terraform
          skip-files: infra/terraform/tfplan*,infra/terraform/terraform.tfstate
          trivyignores: .trivyignore.yaml
          severity: HIGH,CRITICAL
          format: sarif
          output: trivy-policy.sarif
          limit-severities-for-sarif: true
          exit-code: 0
          skip-setup-trivy: true
      - name: Upload IaC and secret SARIF
        id: repository_policy_upload
        if: steps.repository_policy_report.outcome == 'success' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4
        with:
          sarif_file: trivy-policy.sarif
          category: trivy-policy
      - name: Enforce IaC and secret policy
        id: repository_policy
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: misconfig,secret
          skip-dirs: infra/terraform/.terraform
          skip-files: infra/terraform/tfplan*,infra/terraform/terraform.tfstate
          trivyignores: .trivyignore.yaml
          severity: HIGH,CRITICAL
          format: table
          exit-code: 1
          skip-setup-trivy: true
      - name: Download the exact image archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.build_images.outputs.artifact_id }}
          path: release-images
          digest-mismatch: error
      - name: Verify image archive integrity
        env:
          EXPECTED_BACKEND_SHA256: ${{ needs.build_images.outputs.backend_sha256 }}
          EXPECTED_FRONTEND_SHA256: ${{ needs.build_images.outputs.frontend_sha256 }}
        run: |
          cd release-images
          sha256sum --check SHA256SUMS
          [[ "$(sha256sum backend-image.tar | cut -d ' ' -f 1)" == "$EXPECTED_BACKEND_SHA256" ]]
          [[ "$(sha256sum frontend-image.tar | cut -d ' ' -f 1)" == "$EXPECTED_FRONTEND_SHA256" ]]
      - name: Scan backend image archive
        id: backend_image_report
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          input: release-images/backend-image.tar
          scanners: vuln
          severity: HIGH,CRITICAL
          format: json
          output: backend-vulnerabilities.json
          exit-code: 0
          skip-setup-trivy: true
      - name: Scan frontend image archive
        id: frontend_image_report
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          input: release-images/frontend-image.tar
          scanners: vuln
          severity: HIGH,CRITICAL
          format: json
          output: frontend-vulnerabilities.json
          exit-code: 0
          skip-setup-trivy: true
      - name: Convert container reports to SARIF
        id: container_sarif
        continue-on-error: true
        run: |
          trivy convert --format sarif --severity HIGH,CRITICAL \
            --output trivy-backend.sarif backend-vulnerabilities.json
          trivy convert --format sarif --severity HIGH,CRITICAL \
            --output trivy-frontend.sarif frontend-vulnerabilities.json
      - name: Upload backend container SARIF
        id: backend_image_upload
        if: steps.container_sarif.outcome == 'success' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4
        with:
          sarif_file: trivy-backend.sarif
          category: trivy-backend
      - name: Upload frontend container SARIF
        id: frontend_image_upload
        if: steps.container_sarif.outcome == 'success' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4
        with:
          sarif_file: trivy-frontend.sarif
          category: trivy-frontend
      - name: Enforce container vulnerability policy
        id: container_policy
        continue-on-error: true
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          blocked = []
          for report_name in ("backend-vulnerabilities.json", "frontend-vulnerabilities.json"):
              report = json.loads(Path(report_name).read_text())
              for result in report.get("Results", []):
                  for vulnerability in result.get("Vulnerabilities") or []:
                      severity = vulnerability.get("Severity", "UNKNOWN")
                      fixed = bool(vulnerability.get("FixedVersion"))
                      if severity == "CRITICAL" or (severity == "HIGH" and fixed):
                          blocked.append(
                              (
                                  report_name,
                                  vulnerability.get("VulnerabilityID", "unknown"),
                                  vulnerability.get("PkgName", "unknown"),
                                  severity,
                                  vulnerability.get("FixedVersion") or "unfixed",
                              )
                          )

          if blocked:
              for report, identifier, package, severity, fixed_version in blocked:
                  print(f"BLOCKED {report}: {identifier} {package} {severity} fixed={fixed_version}")
              raise SystemExit(f"Blocked {len(blocked)} container vulnerability finding(s)")
          print("No critical or fixable high container vulnerabilities detected.")
          PY
      - name: Smoke test hardened exact runtime images
        id: container_smoke
        continue-on-error: true
        env:
          POSTGRES_IMAGE: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
        run: |
          set -Eeuo pipefail

          suffix="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          network_name="opsforge-smoke-${suffix}"
          postgres_name="opsforge-smoke-postgres-${suffix}"
          migration_name="opsforge-smoke-migration-${suffix}"
          backend_name="opsforge-smoke-backend-${suffix}"
          frontend_name="opsforge-smoke-frontend-${suffix}"
          containers=(
            "$frontend_name"
            "$backend_name"
            "$migration_name"
            "$postgres_name"
          )

          container_running() {
            [[ "$(docker container inspect --format '{{.State.Running}}' "$1" 2>/dev/null || true)" == "true" ]]
          }

          dump_diagnostics() {
            local marker
            marker=$(tr -d '-' </proc/sys/kernel/random/uuid)
            echo "::stop-commands::$marker"
            for container in "${containers[@]}"; do
              if docker container inspect "$container" >/dev/null 2>&1; then
                echo "===== $container state ====="
                docker container inspect \
                  --format 'status={{.State.Status}} exit={{.State.ExitCode}} error={{json .State.Error}}{{if .State.Health}} health={{.State.Health.Status}}{{end}}' \
                  "$container" 2>&1 || true
                echo "===== $container logs ====="
                docker container logs --timestamps "$container" 2>&1 || true
              fi
            done
            echo "::$marker::"
          }

          cleanup() {
            local result=$?
            trap - EXIT INT TERM
            set +e
            if (( result != 0 )); then
              dump_diagnostics
            fi
            for container in "${containers[@]}"; do
              docker container rm --force --volumes "$container" >/dev/null 2>&1 || true
            done
            docker network rm "$network_name" >/dev/null 2>&1 || true
            exit "$result"
          }
          trap cleanup EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM

          wait_for_container_health() {
            local container="$1"
            local health
            for _ in {1..45}; do
              health=$(docker container inspect \
                --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}missing{{end}}' \
                "$container" 2>/dev/null || true)
              if [[ "$health" == "healthy" ]]; then
                return 0
              fi
              if ! container_running "$container"; then
                echo "$container stopped before becoming healthy." >&2
                return 1
              fi
              sleep 2
            done
            echo "$container did not become healthy before timeout." >&2
            return 1
          }

          wait_for_json_health() {
            local label="$1"
            local url="$2"
            local container="$3"
            local body
            for _ in {1..30}; do
              if body=$(curl --noproxy '*' --fail --silent \
                --connect-timeout 2 --max-time 3 "$url") &&
                jq -e \
                  '.success == true and .data.status == "healthy"' \
                  <<<"$body" >/dev/null; then
                echo "$label passed."
                return 0
              fi
              if ! container_running "$container"; then
                echo "$container stopped while checking $label." >&2
                return 1
              fi
              sleep 2
            done
            echo "$label did not pass before timeout." >&2
            return 1
          }

          wait_for_text_health() {
            local label="$1"
            local url="$2"
            local container="$3"
            local body
            for _ in {1..30}; do
              if body=$(curl --noproxy '*' --fail --silent \
                --connect-timeout 2 --max-time 3 "$url") &&
                [[ "$body" == "ok" ]]; then
                echo "$label passed."
                return 0
              fi
              if ! container_running "$container"; then
                echo "$container stopped while checking $label." >&2
                return 1
              fi
              sleep 2
            done
            echo "$label did not pass before timeout." >&2
            return 1
          }

          wait_for_container_ipv4() {
            local container="$1"
            local address
            local octet
            local valid
            local -a octets
            for _ in {1..30}; do
              address=$(docker container inspect "$container" 2>/dev/null |
                jq -er --arg network "$network_name" \
                  '.[0].NetworkSettings.Networks[$network].IPAddress |
                   select(type == "string" and length > 0)' 2>/dev/null || true)
              IFS=. read -r -a octets <<<"$address"
              valid=true
              if (( ${#octets[@]} != 4 )); then
                valid=false
              else
                for octet in "${octets[@]}"; do
                  if [[ ! "$octet" =~ ^[0-9]{1,3}$ ]] || (( 10#$octet > 255 )); then
                    valid=false
                    break
                  fi
                done
              fi
              if [[ "$valid" == "true" ]] &&
                (( 10#${octets[0]} != 0 && 10#${octets[0]} != 127 && 10#${octets[0]} < 224 )); then
                printf '%s\n' "$address"
                return 0
              fi
              if ! container_running "$container"; then
                echo "$container stopped before Docker assigned its internal IPv4 address." >&2
                return 1
              fi
              sleep 1
            done
            echo "Docker did not assign an internal IPv4 address to $container before timeout." >&2
            return 1
          }

          assert_hardening() {
            local container="$1"
            local expected_user="$2"
            docker container inspect "$container" |
              jq -e --arg expected_user "$expected_user" '
                .[0] |
                (.Config.User == $expected_user) and
                (.HostConfig.ReadonlyRootfs == true) and
                (.HostConfig.CapDrop | index("ALL") != null) and
                (
                  .HostConfig.SecurityOpt |
                  any(startswith("no-new-privileges"))
                )
              ' >/dev/null
          }

          assert_running_identity() {
            local container="$1"
            local expected_uid="$2"
            local expected_gid="$3"
            docker container exec "$container" sh -ec \
              'test "$(id -u):$(id -g)" = "$1:$2"' \
              smoke "$expected_uid" "$expected_gid"
          }

          assert_no_published_ports() {
            docker container inspect "$1" |
              jq -e '
                .[0] |
                ((.HostConfig.PortBindings // {}) | length == 0) and
                (all((.NetworkSettings.Ports // {})[]; . == null))
              ' >/dev/null
          }

          docker load --input release-images/backend-image.tar
          docker load --input release-images/frontend-image.tar

          backend_image_id=$(docker image inspect \
            --format '{{.Id}}' "$BACKEND_IMAGE:$GITHUB_SHA")
          frontend_image_id=$(docker image inspect \
            --format '{{.Id}}' "$FRONTEND_IMAGE:$GITHUB_SHA")

          [[ "$backend_image_id" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$frontend_image_id" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' \
            "$backend_image_id")" == "linux/amd64" ]]
          [[ "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' \
            "$frontend_image_id")" == "linux/amd64" ]]

          docker pull --platform linux/amd64 "$POSTGRES_IMAGE"
          docker network create --internal "$network_name"
          docker network inspect "$network_name" |
            jq -e '.[0].Internal == true' >/dev/null

          docker run --detach \
            --name "$postgres_name" \
            --network "$network_name" \
            --network-alias postgres \
            --pull=never \
            --pids-limit 256 \
            --memory 512m \
            --health-cmd 'pg_isready -U opsforge -d opsforge_smoke' \
            --health-interval 2s \
            --health-timeout 2s \
            --health-retries 30 \
            --env POSTGRES_DB=opsforge_smoke \
            --env POSTGRES_USER=opsforge \
            --env POSTGRES_HOST_AUTH_METHOD=trust \
            "$POSTGRES_IMAGE"

          wait_for_container_health "$postgres_name"

          backend_runtime=(
            --network "$network_name"
            --pull=never
            --user 10001:10001
            --read-only
            --tmpfs "/tmp:rw,noexec,nosuid,nodev,size=64m,uid=10001,gid=10001,mode=1770"
            --cap-drop ALL
            --security-opt no-new-privileges:true
            --pids-limit 256
            --memory 768m
          )
          backend_environment=(
            --env APP_ENV=production
            --env APP_DEBUG=false
            --env DATABASE_URL=postgresql://opsforge@postgres:5432/opsforge_smoke
            --env JWT_SECRET_KEY=public-ci-smoke-key-not-a-secret
            --env ADMIN_EMAIL=smoke@example.invalid
            --env ADMIN_PASSWORD=public-ci-smoke-password-not-a-secret
            --env EMAIL_PROVIDER=console
            --env AI_ENABLED=false
            --env TRIVY_ENABLED=false
          )

          docker run \
            --name "$migration_name" \
            "${backend_runtime[@]}" \
            "${backend_environment[@]}" \
            "$backend_image_id" \
            alembic upgrade head

          assert_hardening "$migration_name" "10001:10001"
          docker container inspect "$migration_name" |
            jq -e '.[0].HostConfig.Tmpfs | has("/tmp")' >/dev/null

          docker run --detach \
            --name "$backend_name" \
            "${backend_runtime[@]}" \
            "${backend_environment[@]}" \
            --network-alias backend \
            "$backend_image_id" \
            uvicorn app.main:app --host 0.0.0.0 --port 8000

          assert_hardening "$backend_name" "10001:10001"
          assert_running_identity "$backend_name" 10001 10001
          assert_no_published_ports "$backend_name"
          docker container inspect "$backend_name" |
            jq -e '.[0].HostConfig.Tmpfs | has("/tmp")' >/dev/null

          backend_ip=$(wait_for_container_ipv4 "$backend_name")
          wait_for_json_health \
            "Backend /api/health" \
            "http://${backend_ip}:8000/api/health" \
            "$backend_name"

          docker run --detach \
            --name "$frontend_name" \
            --network "$network_name" \
            --pull=never \
            --user 101:101 \
            --read-only \
            --tmpfs /var/cache/nginx:rw,noexec,nosuid,nodev,size=32m,uid=101,gid=101,mode=0750 \
            --tmpfs /var/run:rw,noexec,nosuid,nodev,size=4m,uid=101,gid=101,mode=0750 \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=16m,uid=101,gid=101,mode=1770 \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --pids-limit 128 \
            --memory 256m \
            "$frontend_image_id"

          assert_hardening "$frontend_name" "101:101"
          assert_running_identity "$frontend_name" 101 101
          assert_no_published_ports "$frontend_name"
          docker container inspect "$frontend_name" |
            jq -e '
              .[0].HostConfig.Tmpfs |
              has("/var/cache/nginx") and has("/var/run") and has("/tmp")
            ' >/dev/null

          frontend_ip=$(wait_for_container_ipv4 "$frontend_name")

          wait_for_text_health \
            "Frontend /health" \
            "http://${frontend_ip}:8080/health" \
            "$frontend_name"
          wait_for_json_health \
            "Frontend-proxied /api/health" \
            "http://${frontend_ip}:8080/api/health" \
            "$frontend_name"
      - name: Re-verify the approved scanner after exact-image execution
        id: trivy_post_smoke_integrity
        continue-on-error: true
        env:
          EXPECTED_TRIVY_BINARY_SHA256: ${{ steps.trivy_toolchain.outputs.binary_sha256 }}
          EXPECTED_TRIVY_VERSION: ${{ steps.trivy_toolchain.outputs.version }}
        run: |
          set -euo pipefail
          scanner="$RUNNER_TEMP/opsforge-trivy-bin/trivy"
          [[ "$EXPECTED_TRIVY_BINARY_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$EXPECTED_TRIVY_VERSION" == "v0.73.0-opsforge.1" ]]
          [[ -x "$scanner" ]]
          [[ "$(command -v trivy)" == "$scanner" ]]
          [[ "$(sha256sum "$scanner" | cut -d ' ' -f 1)" == "$EXPECTED_TRIVY_BINARY_SHA256" ]]
          "$scanner" version | grep -F "Version: ${EXPECTED_TRIVY_VERSION#v}"
      - name: Generate backend CycloneDX SBOM
        id: backend_sbom
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          input: release-images/backend-image.tar
          format: cyclonedx
          output: backend-sbom.cdx.json
          skip-setup-trivy: true
      - name: Generate frontend CycloneDX SBOM
        id: frontend_sbom
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          input: release-images/frontend-image.tar
          format: cyclonedx
          output: frontend-sbom.cdx.json
          skip-setup-trivy: true
      - name: Validate generated SBOMs
        id: validate_sboms
        continue-on-error: true
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          for name in ("backend-sbom.cdx.json", "frontend-sbom.cdx.json"):
              document = json.loads(Path(name).read_text())
              if document.get("bomFormat") != "CycloneDX":
                  raise SystemExit(f"{name} is not a CycloneDX SBOM")
              if not document.get("components"):
                  raise SystemExit(f"{name} contains no components")
              print(f"Validated {name} with {len(document['components'])} components")
          PY
      - name: Enforce centralized security gate
        id: enforce
        if: always()
        env:
          CODEQL_INIT: ${{ steps.codeql_init.outcome }}
          TRIVY_GO: ${{ steps.trivy_go.outcome }}
          TRIVY_TOOLCHAIN: ${{ steps.trivy_toolchain.outcome }}
          DEPENDENCY_SCANNER_DEPENDENCIES: ${{ steps.dependency_scanner_dependencies.outcome }}
          GITOPS_TOOL_DEPENDENCIES: ${{ steps.gitops_tool_dependencies.outcome }}
          BACKEND_DEPENDENCIES: ${{ steps.backend_dependencies.outcome }}
          FRONTEND_DEPENDENCIES: ${{ steps.frontend_dependencies.outcome }}
          WORKFLOW_SECURITY: ${{ steps.workflow_security.outcome }}
          CODEQL_ANALYZE: ${{ steps.codeql_analyze.outcome }}
          CODEQL_POLICY: ${{ steps.codeql_policy.outcome }}
          TRIVY_INTEGRITY: ${{ steps.trivy_integrity.outcome }}
          REPOSITORY_POLICY_REPORT: ${{ steps.repository_policy_report.outcome }}
          REPOSITORY_POLICY_UPLOAD: ${{ steps.repository_policy_upload.outcome }}
          REPOSITORY_POLICY: ${{ steps.repository_policy.outcome }}
          BACKEND_IMAGE_REPORT: ${{ steps.backend_image_report.outcome }}
          FRONTEND_IMAGE_REPORT: ${{ steps.frontend_image_report.outcome }}
          CONTAINER_SARIF: ${{ steps.container_sarif.outcome }}
          BACKEND_IMAGE_UPLOAD: ${{ steps.backend_image_upload.outcome }}
          FRONTEND_IMAGE_UPLOAD: ${{ steps.frontend_image_upload.outcome }}
          CONTAINER_POLICY: ${{ steps.container_policy.outcome }}
          CONTAINER_SMOKE: ${{ steps.container_smoke.outcome }}
          TRIVY_POST_SMOKE_INTEGRITY: ${{ steps.trivy_post_smoke_integrity.outcome }}
          BACKEND_SBOM: ${{ steps.backend_sbom.outcome }}
          FRONTEND_SBOM: ${{ steps.frontend_sbom.outcome }}
          VALIDATE_SBOMS: ${{ steps.validate_sboms.outcome }}
          SARIF_REQUIRED: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          failures=0
          check_result() {
            local label="$1"
            local result="$2"
            if [[ "$result" == "success" ]]; then
              echo "- :white_check_mark: $label" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "- :x: $label ($result)" >> "$GITHUB_STEP_SUMMARY"
              failures=$((failures + 1))
            fi
          }
          echo "### Centralized security gate" >> "$GITHUB_STEP_SUMMARY"
          check_result "CodeQL initialization" "$CODEQL_INIT"
          check_result "Pinned Go toolchain setup" "$TRIVY_GO"
          check_result "Pinned Trivy build and self-scan" "$TRIVY_TOOLCHAIN"
          check_result "Hash-locked dependency-scanner audit" "$DEPENDENCY_SCANNER_DEPENDENCIES"
          check_result "Hash-locked GitOps promotion-tool audit" "$GITOPS_TOOL_DEPENDENCIES"
          check_result "Backend dependency audit" "$BACKEND_DEPENDENCIES"
          check_result "Frontend dependency audit" "$FRONTEND_DEPENDENCIES"
          check_result "GitHub Actions security audit" "$WORKFLOW_SECURITY"
          check_result "CodeQL analysis" "$CODEQL_ANALYZE"
          check_result "CodeQL severity policy" "$CODEQL_POLICY"
          check_result "Approved scanner integrity before scans" "$TRIVY_INTEGRITY"
          check_result "IaC and secret report" "$REPOSITORY_POLICY_REPORT"
          check_result "IaC and secret enforcement" "$REPOSITORY_POLICY"
          check_result "Backend image scan" "$BACKEND_IMAGE_REPORT"
          check_result "Frontend image scan" "$FRONTEND_IMAGE_REPORT"
          check_result "Container SARIF generation" "$CONTAINER_SARIF"
          check_result "Container vulnerability policy" "$CONTAINER_POLICY"
          check_result "Hardened exact-image runtime smoke" "$CONTAINER_SMOKE"
          check_result "Approved scanner integrity after runtime smoke" "$TRIVY_POST_SMOKE_INTEGRITY"
          check_result "Backend SBOM" "$BACKEND_SBOM"
          check_result "Frontend SBOM" "$FRONTEND_SBOM"
          check_result "SBOM validation" "$VALIDATE_SBOMS"
          if [[ "$SARIF_REQUIRED" == "true" ]]; then
            check_result "IaC and secret SARIF upload" "$REPOSITORY_POLICY_UPLOAD"
            check_result "Backend container SARIF upload" "$BACKEND_IMAGE_UPLOAD"
            check_result "Frontend container SARIF upload" "$FRONTEND_IMAGE_UPLOAD"
          fi
          if (( failures > 0 )); then
            echo "$failures mandatory security control(s) did not succeed." >&2
            exit 1
          fi
      - name: Create approved release evidence
        env:
          IMAGE_ARTIFACT_ID: ${{ needs.build_images.outputs.artifact_id }}
          IMAGE_ARTIFACT_DIGEST: ${{ needs.build_images.outputs.artifact_digest }}
          BACKEND_SHA256: ${{ needs.build_images.outputs.backend_sha256 }}
          FRONTEND_SHA256: ${{ needs.build_images.outputs.frontend_sha256 }}
          TRIVY_BINARY_SHA256: ${{ steps.trivy_toolchain.outputs.binary_sha256 }}
          TRIVY_GO_VERSION: ${{ steps.trivy_toolchain.outputs.go_version }}
          TRIVY_PATCH_COMMIT: ${{ steps.trivy_toolchain.outputs.patch_commit }}
          TRIVY_PATCH_SHA256: ${{ steps.trivy_toolchain.outputs.patch_sha256 }}
          TRIVY_SOURCE_COMMIT: ${{ steps.trivy_toolchain.outputs.source_commit }}
          TRIVY_SOURCE_TREE: ${{ steps.trivy_toolchain.outputs.source_tree }}
          TRIVY_VERSION: ${{ steps.trivy_toolchain.outputs.version }}
        run: |
          mkdir -p security-evidence
          cp \
            backend-sbom.cdx.json \
            frontend-sbom.cdx.json \
            trivy-toolchain-build-info.txt \
            trivy-toolchain-version.txt \
            trivy-toolchain-vulnerabilities.json \
            trivy-toolchain.patch \
            security-evidence/
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          def sha256(path):
              digest = hashlib.sha256()
              with Path(path).open("rb") as stream:
                  for chunk in iter(lambda: stream.read(1024 * 1024), b""):
                      digest.update(chunk)
              return digest.hexdigest()

          approval = {
              "schema": 4,
              "repository": os.environ["GITHUB_REPOSITORY"],
              "commit": os.environ["GITHUB_SHA"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "image_artifact": {
                  "id": os.environ["IMAGE_ARTIFACT_ID"],
                  "digest": os.environ["IMAGE_ARTIFACT_DIGEST"],
              },
              "images": {
                  "backend": {"archive_sha256": os.environ["BACKEND_SHA256"]},
                  "frontend": {"archive_sha256": os.environ["FRONTEND_SHA256"]},
              },
              "sboms": {
                  "backend": {"sha256": sha256("security-evidence/backend-sbom.cdx.json")},
                  "frontend": {"sha256": sha256("security-evidence/frontend-sbom.cdx.json")},
              },
              "scanner": {
                  "name": "trivy",
                  "distribution": "temporary OpsForge-maintained derivative",
                  "owner": "platform",
                  "review_by": "2026-09-30",
                  "replacement_condition": "first clean official release",
                  "vulnerability_waiver": False,
                  "version": os.environ["TRIVY_VERSION"],
                  "go_version": os.environ["TRIVY_GO_VERSION"],
                  "source_commit": os.environ["TRIVY_SOURCE_COMMIT"],
                  "source_tree": os.environ["TRIVY_SOURCE_TREE"],
                  "patch_commit": os.environ["TRIVY_PATCH_COMMIT"],
                  "patch_sha256": os.environ["TRIVY_PATCH_SHA256"],
                  "binary_sha256": os.environ["TRIVY_BINARY_SHA256"],
                  "build_info_sha256": sha256(
                      "security-evidence/trivy-toolchain-build-info.txt"
                  ),
                  "version_report_sha256": sha256(
                      "security-evidence/trivy-toolchain-version.txt"
                  ),
                  "self_scan_sha256": sha256(
                      "security-evidence/trivy-toolchain-vulnerabilities.json"
                  ),
              },
              "policy": {
                  "codeql_minimum_security_severity": 7.0,
                  "containers": "all critical and all fixable high vulnerabilities",
              },
          }
          Path("security-evidence/approval.json").write_text(
              json.dumps(approval, indent=2, sort_keys=True) + "\n"
          )
          PY
      - name: Upload approved release evidence
        id: evidence
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: security-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: security-evidence/
          if-no-files-found: error
          retention-days: 7
          compression-level: 6
          overwrite: false

  release:
    name: Publish and attest approved images
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.security_gate.result == 'success'
    needs: [build_images, security_gate]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write # Push the approved images to GHCR.
      id-token: write # Obtain the OIDC identity used to sign attestations.
      attestations: write # Store provenance and SBOM attestations.
    outputs:
      backend_digest: ${{ steps.publish.outputs.backend_digest }}
      frontend_digest: ${{ steps.publish.outputs.frontend_digest }}
    steps:
      - name: Download approved image archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.build_images.outputs.artifact_id }}
          path: release-images
          digest-mismatch: error
      - name: Download security evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.security_gate.outputs.evidence_artifact_id }}
          path: security-evidence
          digest-mismatch: error
      - name: Verify security approval and artifact hashes
        env:
          EXPECTED_IMAGE_ARTIFACT_ID: ${{ needs.build_images.outputs.artifact_id }}
          EXPECTED_IMAGE_ARTIFACT_DIGEST: ${{ needs.build_images.outputs.artifact_digest }}
          EXPECTED_BACKEND_SHA256: ${{ needs.build_images.outputs.backend_sha256 }}
          EXPECTED_FRONTEND_SHA256: ${{ needs.build_images.outputs.frontend_sha256 }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          def sha256(path):
              digest = hashlib.sha256()
              with Path(path).open("rb") as stream:
                  for chunk in iter(lambda: stream.read(1024 * 1024), b""):
                      digest.update(chunk)
              return digest.hexdigest()

          approval = json.loads(Path("security-evidence/approval.json").read_text())
          expected = {
              "schema": 4,
              "repository": os.environ["GITHUB_REPOSITORY"],
              "commit": os.environ["GITHUB_SHA"],
              "run_id": os.environ["GITHUB_RUN_ID"],
          }
          for key, value in expected.items():
              if approval.get(key) != value:
                  raise SystemExit(f"Approval {key} does not match this workflow run")

          artifact = approval.get("image_artifact", {})
          if artifact.get("id") != os.environ["EXPECTED_IMAGE_ARTIFACT_ID"]:
              raise SystemExit("Approval references a different image artifact ID")
          if artifact.get("digest") != os.environ["EXPECTED_IMAGE_ARTIFACT_DIGEST"]:
              raise SystemExit("Approval references a different image artifact digest")

          archives = {
              "backend": ("release-images/backend-image.tar", os.environ["EXPECTED_BACKEND_SHA256"]),
              "frontend": ("release-images/frontend-image.tar", os.environ["EXPECTED_FRONTEND_SHA256"]),
          }
          for name, (path, expected_hash) in archives.items():
              actual_hash = sha256(path)
              approved_hash = approval.get("images", {}).get(name, {}).get("archive_sha256")
              if actual_hash != expected_hash or actual_hash != approved_hash:
                  raise SystemExit(f"{name} image archive hash is not approved")

          sboms = {
              "backend": "security-evidence/backend-sbom.cdx.json",
              "frontend": "security-evidence/frontend-sbom.cdx.json",
          }
          for name, path in sboms.items():
              actual_hash = sha256(path)
              approved_hash = approval.get("sboms", {}).get(name, {}).get("sha256")
              if actual_hash != approved_hash:
                  raise SystemExit(f"{name} SBOM hash is not approved")

          scanner = approval.get("scanner", {})
          scanner_evidence = {
              "build_info_sha256": "security-evidence/trivy-toolchain-build-info.txt",
              "version_report_sha256": "security-evidence/trivy-toolchain-version.txt",
              "self_scan_sha256": "security-evidence/trivy-toolchain-vulnerabilities.json",
              "patch_sha256": "security-evidence/trivy-toolchain.patch",
          }
          for field, path in scanner_evidence.items():
              if sha256(path) != scanner.get(field):
                  raise SystemExit(f"Trivy scanner evidence {field} is not approved")
          print("Release evidence matches this repository, commit, run, and exact image archives.")
          PY
          cd release-images
          sha256sum --check SHA256SUMS
      - name: Load approved images without executing them
        run: |
          docker load --input release-images/backend-image.tar
          docker load --input release-images/frontend-image.tar
          docker image inspect "$BACKEND_IMAGE:$GITHUB_SHA" >/dev/null
          docker image inspect "$FRONTEND_IMAGE:$GITHUB_SHA" >/dev/null
      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish immutable images
        id: publish
        run: |
          docker push "$BACKEND_IMAGE:$GITHUB_SHA"
          docker push "$FRONTEND_IMAGE:$GITHUB_SHA"
          backend_ref=$(docker image inspect --format='{{index .RepoDigests 0}}' "$BACKEND_IMAGE:$GITHUB_SHA")
          frontend_ref=$(docker image inspect --format='{{index .RepoDigests 0}}' "$FRONTEND_IMAGE:$GITHUB_SHA")
          backend_digest=${backend_ref#*@}
          frontend_digest=${frontend_ref#*@}
          [[ "$backend_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$frontend_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "backend_digest=$backend_digest" >> "$GITHUB_OUTPUT"
          echo "frontend_digest=$frontend_digest" >> "$GITHUB_OUTPUT"
      - name: Attest backend provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ env.BACKEND_IMAGE }}
          subject-digest: ${{ steps.publish.outputs.backend_digest }}
          push-to-registry: true
      - name: Attest backend SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ env.BACKEND_IMAGE }}
          subject-digest: ${{ steps.publish.outputs.backend_digest }}
          sbom-path: security-evidence/backend-sbom.cdx.json
          push-to-registry: true
      - name: Attest frontend provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ env.FRONTEND_IMAGE }}
          subject-digest: ${{ steps.publish.outputs.frontend_digest }}
          push-to-registry: true
      - name: Attest frontend SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ env.FRONTEND_IMAGE }}
          subject-digest: ${{ steps.publish.outputs.frontend_digest }}
          sbom-path: security-evidence/frontend-sbom.cdx.json
          push-to-registry: true

  promote:
    name: Open GitOps promotion PR
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.ENABLE_GITOPS_PROMOTION == 'true' && needs.release.result == 'success'
    needs: release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      GITOPS_OWNER: ${{ vars.GITOPS_OWNER || github.repository_owner }}
      GITOPS_REPOSITORY: ${{ vars.GITOPS_REPOSITORY || 'OpsForge-GitOps' }}
    steps:
      - name: Create repository-scoped GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ secrets.GITOPS_APP_CLIENT_ID }}
          private-key: ${{ secrets.GITOPS_APP_PRIVATE_KEY }}
          owner: ${{ env.GITOPS_OWNER }}
          repositories: ${{ env.GITOPS_REPOSITORY }}
          permission-contents: write
          permission-pull-requests: write
      - name: Checkout trusted promotion script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          path: source
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Checkout GitOps repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ env.GITOPS_OWNER }}/${{ env.GITOPS_REPOSITORY }}
          token: ${{ steps.app-token.outputs.token }}
          path: gitops
          persist-credentials: false
      - name: Update and validate production digests
        working-directory: gitops
        env:
          BACKEND_DIGEST: ${{ needs.release.outputs.backend_digest }}
          FRONTEND_DIGEST: ${{ needs.release.outputs.frontend_digest }}
        run: |
          python -m pip install \
            --disable-pip-version-check \
            --no-cache-dir \
            --no-deps \
            --only-binary=:all: \
            --require-hashes \
            -r ../source/backend/requirements-gitops.txt
          python -m pip check
          [[ "$(python -c 'import yaml; print(yaml.__version__)')" == "6.0.3" ]]
          python ../source/scripts/update-images.py \
            --backend "$BACKEND_IMAGE@$BACKEND_DIGEST" \
            --frontend "$FRONTEND_IMAGE@$FRONTEND_DIGEST"
          kubectl kustomize production >/tmp/opsforge-applications.yaml
          kubectl kustomize production/opsforge >/tmp/opsforge-workloads.yaml
          grep -Fq "image: $BACKEND_IMAGE@$BACKEND_DIGEST" /tmp/opsforge-workloads.yaml
          grep -Fq "image: $FRONTEND_IMAGE@$FRONTEND_DIGEST" /tmp/opsforge-workloads.yaml
          git diff --check
      - name: Open promotion pull request
        working-directory: gitops
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh auth setup-git
          branch="promote/${GITHUB_SHA}"
          repository="$GITOPS_OWNER/$GITOPS_REPOSITORY"
          git config user.name "opsforge-gitops[bot]"
          git config user.email "opsforge-gitops[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add production
          if git diff --cached --quiet; then
            existing_pr=$(gh api --method GET "repos/$repository/pulls" \
              -f state=open \
              -f base=main \
              -f head="$GITOPS_OWNER:$branch" \
              --jq '.[0].number // empty')
            if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
              git fetch --no-tags origin "refs/heads/$branch:refs/remotes/origin/$branch"
              if ! git diff --quiet "refs/remotes/origin/$branch" HEAD; then
                echo "A stale promotion branch could roll back the already-promoted digests." >&2
                exit 1
              fi
            elif [[ -n "$existing_pr" ]]; then
              echo "Promotion PR #$existing_pr has no matching repository-owned branch." >&2
              exit 1
            fi
            if [[ -n "$existing_pr" ]]; then
              pr_head=$(gh api "repos/$repository/pulls/$existing_pr" --jq .head.sha)
              remote_head=$(git rev-parse "refs/remotes/origin/$branch")
              if [[ "$pr_head" != "$remote_head" ]]; then
                echo "Promotion PR #$existing_pr does not point at the validated branch head." >&2
                exit 1
              fi
            fi
            echo "These image digests are already promoted."
            exit 0
          fi
          git commit -m "promote: OpsForge ${GITHUB_SHA}"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            git fetch --no-tags origin "refs/heads/$branch:refs/remotes/origin/$branch"
            if ! git diff --quiet "refs/remotes/origin/$branch" HEAD; then
              echo "Remote promotion branch exists with different content; reconcile or delete it before retrying." >&2
              exit 1
            fi
          else
            git push --set-upstream origin "$branch"
          fi
          existing_pr=$(gh api --method GET "repos/$repository/pulls" \
            -f state=open \
            -f base=main \
            -f head="$GITOPS_OWNER:$branch" \
            --jq '.[0].number // empty')
          if [[ -n "$existing_pr" ]]; then
            pr_head=$(gh api "repos/$repository/pulls/$existing_pr" --jq .head.sha)
            remote_head=$(git rev-parse "refs/remotes/origin/$branch")
            if [[ "$pr_head" != "$remote_head" ]] || ! git diff --quiet "$remote_head" HEAD; then
              echo "Promotion PR #$existing_pr does not contain the exact validated digest change." >&2
              exit 1
            fi
            echo "Promotion PR #$existing_pr already contains the exact validated digest change."
            exit 0
          fi
          gh pr create --repo "$repository" --base main --head "$branch" \
            --title "promote: OpsForge ${GITHUB_SHA}" \
            --body "Promotes signed backend and frontend image digests built from ${GITHUB_REPOSITORY}@${GITHUB_SHA}."
