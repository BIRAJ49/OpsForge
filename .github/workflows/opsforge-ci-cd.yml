name: OpsForge CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "30 0 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: opsforge-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: opsforge-backend
  FRONTEND_IMAGE: opsforge-frontend

jobs:
  test:
    name: Test and build
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Run backend tests
        working-directory: backend
        run: pytest -q

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  build-and-push:
    name: Build and push images
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name != 'schedule'
    permissions:
      contents: read
      packages: write
    outputs:
      backend_image: ${{ steps.images.outputs.backend }}
      frontend_image: ${{ steps.images.outputs.frontend }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Prepare image names
        id: images
        run: |
          OWNER_LC="${GITHUB_REPOSITORY_OWNER,,}"
          echo "backend=${REGISTRY}/${OWNER_LC}/${BACKEND_IMAGE}" >> "$GITHUB_OUTPUT"
          echo "frontend=${REGISTRY}/${OWNER_LC}/${FRONTEND_IMAGE}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.images.outputs.backend }}:${{ github.sha }}
          cache-from: type=gha,scope=opsforge-backend
          cache-to: type=gha,scope=opsforge-backend,mode=max

      - name: Build and push frontend image
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.images.outputs.frontend }}:${{ github.sha }}
          cache-from: type=gha,scope=opsforge-frontend
          cache-to: type=gha,scope=opsforge-frontend,mode=max

  codeql:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language:
          - python
          - javascript-typescript

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - name: Analyze source code
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}

  infrastructure-scan:
    name: Scan infrastructure configuration
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Generate infrastructure security report
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: misconfig
          trivyignores: .trivyignore.yaml
          severity: HIGH,CRITICAL
          format: sarif
          output: trivy-iac.sarif
          exit-code: 0

      - name: Upload infrastructure security report
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-iac.sarif
          category: trivy-iac

      - name: Enforce infrastructure security policy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: misconfig
          trivyignores: .trivyignore.yaml
          severity: HIGH,CRITICAL
          format: table
          exit-code: 1
          skip-setup-trivy: true

  security-scan:
    name: Scan container images
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      packages: read
      security-events: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate backend vulnerability report
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ needs.build-and-push.outputs.backend_image }}:${{ github.sha }}
          format: sarif
          output: trivy-backend.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          limit-severities-for-sarif: true
          scanners: vuln
          vuln-type: os,library

      - name: Upload backend vulnerability report
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-backend.sarif
          category: trivy-backend

      - name: Generate frontend vulnerability report
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ needs.build-and-push.outputs.frontend_image }}:${{ github.sha }}
          format: sarif
          output: trivy-frontend.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          limit-severities-for-sarif: true
          scanners: vuln
          vuln-type: os,library
          skip-setup-trivy: true

      - name: Upload frontend vulnerability report
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-frontend.sarif
          category: trivy-frontend

      - name: Enforce backend critical vulnerability policy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ needs.build-and-push.outputs.backend_image }}:${{ github.sha }}
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          scanners: vuln
          vuln-type: os,library
          skip-setup-trivy: true

      - name: Enforce frontend critical vulnerability policy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ needs.build-and-push.outputs.frontend_image }}:${{ github.sha }}
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          scanners: vuln
          vuln-type: os,library
          skip-setup-trivy: true

  update-gitops:
    name: Update GitOps image tags
    runs-on: ubuntu-latest
    needs:
      - build-and-push
      - codeql
      - infrastructure-scan
      - security-scan
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          ssh-key: ${{ secrets.GITOPS_DEPLOY_KEY }}

      - name: Install Kustomize
        env:
          KUSTOMIZE_VERSION: 5.8.1
        run: |
          ARCHIVE="kustomize_v${KUSTOMIZE_VERSION}_linux_amd64.tar.gz"
          RELEASE_URL="https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv${KUSTOMIZE_VERSION}"
          curl --fail --silent --show-error --location --output "$ARCHIVE" "$RELEASE_URL/$ARCHIVE"
          curl --fail --silent --show-error --location --output checksums.txt "$RELEASE_URL/checksums.txt"
          grep "  $ARCHIVE$" checksums.txt | sha256sum --check --strict
          tar -xzf "$ARCHIVE"
          sudo install -m 0755 kustomize /usr/local/bin/kustomize

      - name: Set immutable image tags
        working-directory: deploy/k8s/opsforge
        env:
          BACKEND_IMAGE: ${{ needs.build-and-push.outputs.backend_image }}
          FRONTEND_IMAGE: ${{ needs.build-and-push.outputs.frontend_image }}
        run: |
          kustomize edit set image "$BACKEND_IMAGE=$BACKEND_IMAGE:$GITHUB_SHA"
          kustomize edit set image "$FRONTEND_IMAGE=$FRONTEND_IMAGE:$GITHUB_SHA"

      - name: Commit image tags
        run: |
          if git diff --quiet -- deploy/k8s/opsforge/kustomization.yaml; then
            echo "Image tags are already current"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deploy/k8s/opsforge/kustomization.yaml
          git commit -m "chore(gitops): update images to ${GITHUB_SHA} [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
