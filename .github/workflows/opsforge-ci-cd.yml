name: OpsForge CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: opsforge-main-deploy
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: opsforge-backend
  FRONTEND_IMAGE: opsforge-frontend

jobs:
  test:
    name: Test and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Run backend tests
        working-directory: backend
        run: pytest -q

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  build-and-push:
    name: Build and push images
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
    outputs:
      backend_image: ${{ steps.images.outputs.backend }}
      frontend_image: ${{ steps.images.outputs.frontend }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Prepare image names
        id: images
        run: |
          OWNER_LC="${GITHUB_REPOSITORY_OWNER,,}"
          echo "backend=${REGISTRY}/${OWNER_LC}/${BACKEND_IMAGE}" >> "$GITHUB_OUTPUT"
          echo "frontend=${REGISTRY}/${OWNER_LC}/${FRONTEND_IMAGE}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.images.outputs.backend }}:latest
            ${{ steps.images.outputs.backend }}:${{ github.sha }}
          cache-from: type=gha,scope=opsforge-backend
          cache-to: type=gha,scope=opsforge-backend,mode=max

      - name: Build and push frontend image
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.images.outputs.frontend }}:latest
            ${{ steps.images.outputs.frontend }}:${{ github.sha }}
          cache-from: type=gha,scope=opsforge-frontend
          cache-to: type=gha,scope=opsforge-frontend,mode=max

  update-gitops:
    name: Update GitOps image tags
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name != 'pull_request'
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Install Kustomize
        env:
          KUSTOMIZE_VERSION: 5.8.1
        run: |
          ARCHIVE="kustomize_v${KUSTOMIZE_VERSION}_linux_amd64.tar.gz"
          RELEASE_URL="https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv${KUSTOMIZE_VERSION}"
          curl --fail --silent --show-error --location --output "$ARCHIVE" "$RELEASE_URL/$ARCHIVE"
          curl --fail --silent --show-error --location --output checksums.txt "$RELEASE_URL/checksums.txt"
          grep "  $ARCHIVE$" checksums.txt | sha256sum --check --strict
          tar -xzf "$ARCHIVE"
          sudo install -m 0755 kustomize /usr/local/bin/kustomize

      - name: Set immutable image tags
        working-directory: deploy/k8s/opsforge
        env:
          BACKEND_IMAGE: ${{ needs.build-and-push.outputs.backend_image }}
          FRONTEND_IMAGE: ${{ needs.build-and-push.outputs.frontend_image }}
        run: |
          kustomize edit set image "$BACKEND_IMAGE=$BACKEND_IMAGE:$GITHUB_SHA"
          kustomize edit set image "$FRONTEND_IMAGE=$FRONTEND_IMAGE:$GITHUB_SHA"

      - name: Commit image tags
        run: |
          if git diff --quiet -- deploy/k8s/opsforge/kustomization.yaml; then
            echo "Image tags are already current"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deploy/k8s/opsforge/kustomization.yaml
          git commit -m "chore(gitops): update images to ${GITHUB_SHA} [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
