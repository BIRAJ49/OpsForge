apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: opsforge-alerts
  namespace: monitoring
  labels:
    release: monitoring
spec:
  groups:
    - name: opsforge.availability
      rules:
        - alert: OpsForgeBackendUnavailable
          expr: |
            kube_deployment_status_replicas_available{
              namespace="opsforge-system",
              deployment="opsforge-backend"
            } < 1
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: OpsForge backend is unavailable
            description: No OpsForge backend replica has been available for two minutes.

        - alert: OpsForgeFrontendUnavailable
          expr: |
            kube_deployment_status_replicas_available{
              namespace="opsforge-system",
              deployment="opsforge-frontend"
            } < 1
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: OpsForge frontend is unavailable
            description: No OpsForge frontend replica has been available for two minutes.

        - alert: OpsForgeContainerRestarting
          expr: |
            increase(
              kube_pod_container_status_restarts_total{
                namespace="opsforge-system"
              }[15m]
            ) > 2
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: OpsForge container is repeatedly restarting
            description: A container restarted more than twice during the last 15 minutes.

    - name: opsforge.backups
      rules:
        - alert: OpsForgePostgresBackupFailed
          expr: |
            kube_job_status_failed{
              namespace="opsforge-system",
              job_name=~"postgres-backup-.*"
            } > 0
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: OpsForge PostgreSQL backup failed
            description: A PostgreSQL backup Job has failed and requires investigation.

        - alert: OpsForgePostgresBackupMissing
          expr: |
            (
              time() - max(
                kube_job_status_completion_time{
                  namespace="opsforge-system",
                  job_name=~"postgres-backup-.*"
                }
              ) > 93600
            )
            or
            absent(
              kube_job_status_completion_time{
                namespace="opsforge-system",
                job_name=~"postgres-backup-.*"
              }
            )
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: OpsForge PostgreSQL backup is missing
            description: No successful PostgreSQL backup has completed within the last 26 hours.

        - alert: OpsForgePostgresBackupSuspended
          expr: |
            kube_cronjob_spec_suspend{
              namespace="opsforge-system",
              cronjob="postgres-backup"
            } == 1
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: OpsForge PostgreSQL backups are suspended
            description: The PostgreSQL backup CronJob has been suspended for five minutes.

    - name: opsforge.infrastructure
      rules:
        - alert: OpsForgeNodeNotReady
          expr: kube_node_status_condition{condition="Ready",status="true"} == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: OpsForge K3s node is not ready
            description: The production K3s node has been NotReady for five minutes.

        - alert: OpsForgeNodeDiskPressure
          expr: kube_node_status_condition{condition="DiskPressure",status="true"} == 1
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: OpsForge node has disk pressure
            description: Kubelet reports disk pressure on the production node.

        - alert: OpsForgePersistentVolumeFilling
          expr: |
            kubelet_volume_stats_available_bytes{namespace=~"opsforge-system|monitoring"}
            /
            kubelet_volume_stats_capacity_bytes{namespace=~"opsforge-system|monitoring"}
            < 0.15
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: OpsForge persistent volume is nearly full
            description: A production or monitoring PVC has less than 15 percent free space.

        - alert: OpsForgeCertificateExpiring
          expr: certmanager_certificate_expiration_timestamp_seconds - time() < 1209600
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: OpsForge TLS certificate is expiring
            description: A cert-manager certificate expires in less than 14 days.
