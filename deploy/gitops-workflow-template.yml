name: Validate GitOps deployment

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: gitops-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Render GitOps manifests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Render production manifests
        run: |
          kubectl kustomize production >/tmp/opsforge-applications.yaml
          kubectl kustomize production/opsforge >/tmp/opsforge-workloads.yaml
      - name: Require immutable OpsForge images
        run: |
          set -euo pipefail

          mapfile -t images < <(
            grep -Eo 'ghcr\.io/biraj49/opsforge-(backend|frontend)@sha256:[0-9a-f]{64}' \
              /tmp/opsforge-workloads.yaml \
              | sort -u
          )
          if [[ "${#images[@]}" -ne 2 ]]; then
            echo "Expected exactly two digest-pinned OpsForge images, found ${#images[@]}." >&2
            exit 1
          fi
          for component in backend frontend; do
            if ! printf '%s\n' "${images[@]}" \
              | grep -Eq "^ghcr\\.io/biraj49/opsforge-${component}@sha256:[0-9a-f]{64}$"; then
              echo "Missing digest-pinned $component image." >&2
              exit 1
            fi
          done
